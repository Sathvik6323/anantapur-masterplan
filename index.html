<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        #map {
            width: 1620px;
            height: 883px;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[14.533716392277405,77.3628336560056],[14.83395623547822,77.93285703155195]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_googleearth_0');
        map.getPane('pane_googleearth_0').style.zIndex = 400;
        var layer_googleearth_0 = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            pane: 'pane_googleearth_0',
            opacity: 1.0,
            attribution: 'Tiles &copy; Google &mdash; Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 22
        });
        layer_googleearth_0;
        map.addLayer(layer_googleearth_0);
        map.createPane('pane_aEDiCyGXCopyPage1_modified_1');
        map.getPane('pane_aEDiCyGXCopyPage1_modified_1').style.zIndex = 401;
        var img_aEDiCyGXCopyPage1_modified_1 = 'data/aEDiCyGXCopyPage1_modified_1.png';
        var img_bounds_aEDiCyGXCopyPage1_modified_1 = [[14.589768359619816,77.5524643998737],[14.747490334673712,77.67003857666903]];
        var layer_aEDiCyGXCopyPage1_modified_1 = new L.imageOverlay(img_aEDiCyGXCopyPage1_modified_1,
                                              img_bounds_aEDiCyGXCopyPage1_modified_1,
                                              {pane: 'pane_aEDiCyGXCopyPage1_modified_1'});
        bounds_group.addLayer(layer_aEDiCyGXCopyPage1_modified_1);
        map.addLayer(layer_aEDiCyGXCopyPage1_modified_1);
        var opacityControl = L.control({position: 'topright'});
        opacityControl.onAdd = function(map) {
            var div = L.DomUtil.create('div', 'info opacity-control');
            div.innerHTML = '<label>Overlay Opacity</label>' +
                            '<div class="slider-row">' +
                            '<input id="opacity-slider" type="range" min="0" max="1" step="0.05" value="1">' +
                            '<span id="opacity-value">100%</span>' +
                            '</div>';
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        opacityControl.addTo(map);
        document.getElementById('opacity-slider').addEventListener('input', function(e) {
            var val = parseFloat(e.target.value);
            layer_aEDiCyGXCopyPage1_modified_1.setOpacity(val);
            document.getElementById('opacity-value').textContent = Math.round(val * 100) + '%';
        });
        map.attributionControl.addAttribution('Master Plan Data &copy; <a href="https://ahuda.ap.gov.in" target="_blank">Ananthapuramu&ndash;Hindupur Urban Development Authority (AHUDA)</a> / Town &amp; Country Planning Dept., Govt. of Andhra Pradesh');
        map.attributionControl.addAttribution('Educational Disclaimer: This map and web application are for educational and research purposes only. Not for official, commercial, or legal planning use.');
        setBounds();
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        </script>
    </body>
</html>
